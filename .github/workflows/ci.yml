name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore MediFlow.sln
      - run: dotnet build MediFlow.sln --no-restore -c Release
      - run: dotnet test MediFlow.sln --no-build -c Release --collect:"XPlat Code Coverage"
